<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Decision Wheel</title>
    <!-- To link font "Awesome" for icons-->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="cs/index.css">
    <link rel="stylesheet" href="cs/global.css">
</head>

<body>
    <h2>Can't Decide?</h2>
    <h3>Let the wheel Choose</h3>
    <div class="container">
        <p>Your Options</p>
        <div id="container">

            <div class="row">
                <div class="sr-no">1</div>
                <div class="input"><input type="text" placeholder="Enter your option here">
                </div>
                <div class="del-btn"><button onclick="deleteOption(this)"><i class="fa-solid fa-x"></i></button></div>
            </div>
            <div class="row">
                <div class="sr-no">2</div>
                <div class="input"><input type="text" placeholder="Enter your option here">
                </div>
                <div class="del-btn"><button onclick="deleteOption(this)"><i class="fa-solid fa-x"></i></button></div>
            </div>

        </div>

        <button class="opt-btn" id="opt-btn" onclick="addNewOption()"><i class="fa-solid fa-plus"></i> Add
            Option</button>
        <button class="spin-btn" id="spin-btn" onclick="handleSpinSubmit()">Spin</button>
    </div>



    <script src="JS/input-page.js"></script>
</body>

</html>
